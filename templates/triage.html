<!DOCTYPE html>
<html>
<head>
    <title>Triage Assignment</title>
</head>
<body>

    <h1>Triage Assignment</h1>

    {% if error %}
        <p style="color:red;"><strong>{{ error }}</strong></p>
    {% endif %}

    <form method="POST">

        <label>Patient Name:</label><br>
        <input type="text" name="patient_name" required><br><br>

        <label>Severity (1-10):</label><br>
        <input type="number" name="severity" min="1" max="10" required><br><br>

        <button type="submit">Assign Room</button>

    </form>

    <br>

    <a href="/">
        <button>Back to Home</button>
    </a>

</body>
</html>
