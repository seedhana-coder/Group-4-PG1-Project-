<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Patient - CareBridge Hospital</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>CareBridge Hospital</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/register">Register Patient</a>
        </nav>
    </header>

    <main>

        <div class="form-container">

            <h2>Register Patient</h2>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <label for="name">
                    Patient Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter patient name"
                >

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter patient age"
                >

                <label for="patient_id">
                    Patient ID
                </label>

                <input
                    type="text"
                    id="patient_id"
                    name="patient_id"
                    placeholder="Enter patient ID"
                >

                <button type="submit">
                    Register Patient
                </button>

            </form>

        </div>

    </main>

</body>

</html>
